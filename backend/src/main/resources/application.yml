server:
  port: ${PORT:8080}
  error:
    include-message: always

spring:
  application:
    name: campusnest-backend

  datasource:
    # Neon example: jdbc:postgresql://ep-xxxx.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
    url: ${DB_URL:jdbc:postgresql://localhost:5432/campusnest_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      # "update" creates/alters tables automatically. Move to Flyway migrations once real data matters.
      ddl-auto: ${DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}

app:
  cors:
    # Comma-separated list of exact origins allowed to call the API from a browser.
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
  # Secret for the Verification Hub. Leave empty to disable verification entirely.
  admin-key: ${ADMIN_KEY:}
  # Inserts 3 demo listings on first start when the table is empty. Set false for real launches.
  seed-demo-data: ${SEED_DEMO_DATA:true}
